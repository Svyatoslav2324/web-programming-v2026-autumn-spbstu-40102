<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <title>Лабораторная работа 1</title>
    <link rel="stylesheet" href="styles.css" />

  <body>
    <main>
      <h1>Лабораторная работа 1</h1>
      <div class="card">
        <div class="img-block">
          <img class="img" src="assets/cream_for_heals.jpg" alt="Фото товара" />
        </div>

        <h2 class="title">Бальзам для ног "Гладкие пяточки"</h2>

        <div class="discription">
          Крем для ног, содержащий мочевину, предназначен для избавления от

        </div>

        <div class="reviews">
          <h3 class="reviews-title">Отзывы</h3>

          <div class="reviews-content">
            <ul>
              <li>
                <div class="review-autor">User: user222</div>
                <div class="review-text">Отличный крем</div>
              </li>

              <li>
                <div class="review-autor">User: user111</div>
                <div class="review-text">Пойдёт</div>
              </li>

              <li>
                <div class="review-autor">User: user333</div>
                <div class="review-text">Ужасный крем, 5*</div>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </main>
