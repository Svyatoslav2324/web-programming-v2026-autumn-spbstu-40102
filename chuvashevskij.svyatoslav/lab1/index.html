<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабораторная работа 1</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Лабораторная работа 1</h1>
      <form class="registration">
        <input class="registration__input" type="text" placeholder="Имя" name="name" autocomplete="name"><br>
        <input class="registration__input" type="text" placeholder="E-mail" name="email" autocomplete="email"/><br>
        <input class="registration__input" type="text" placeholder="Телефон" name="phone" autocomplete="tel"/><br>
        <input class="registration__input" type="password" placeholder="Пароль" name="password" autocomplete="off"/><br>
        <input class="registration__input" type="password" placeholder="Пароль еще раз" name="password_confirm" autocomplete="off"/><br>
        <button class="registration__button" type="submit">Регистрация</button>
      </form>
    </main>
  </body>
</html>
